<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aufnahmen - Gitarren-Lerntools</title>
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .recordings-container {
      width: 100%;
      max-width: 680px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .recordings-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .recordings-item {
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      transition: border-color 0.15s, background 0.15s;
    }

    .recordings-item:hover {
      border-color: var(--color-accent);
    }

    .recordings-item--selected {
      border-color: var(--color-accent);
      background: color-mix(in srgb, var(--color-accent) 10%, var(--color-surface));
    }

    .recordings-item__label {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }

    .recordings-item__check {
      margin-top: 0.2rem;
      flex-shrink: 0;
      accent-color: var(--color-accent);
      width: 1.1rem;
      height: 1.1rem;
    }

    .recordings-item__info {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-width: 0;
    }

    .recordings-item__badge {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-accent);
    }

    .recordings-item__name {
      font-size: 0.95rem;
      color: var(--color-text);
      word-break: break-all;
    }

    .recordings-item__meta {
      font-size: 0.78rem;
      color: var(--color-text-muted);
    }

    .recordings-empty {
      color: var(--color-text-muted);
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.9rem;
    }

    .recordings-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      padding: 0.5rem 0;
    }

    .recordings-actions__section-label {
      width: 100%;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-muted);
      margin-bottom: 0.1rem;
    }

    .recordings-actions__delete {
      border-color: #c0392b;
      color: #c0392b;
    }

    .recordings-actions__delete:hover:not(:disabled) {
      background: #fdf0ee;
    }

    .recordings-bulk-actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      border-top: 1px solid var(--color-border);
      padding-top: 0.75rem;
    }

    .recordings-bulk-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <section id="view-recordings" class="view active">
    <gt-exercise-header title="Aufnahmen"></gt-exercise-header>

    <div class="recordings-container">
      <ul id="recordings-list" class="recordings-list"></ul>
      <p id="recordings-empty" class="recordings-empty u-hidden">Keine Aufnahmen vorhanden.</p>

      <!-- Auswahl-Aktionen (sichtbar wenn ≥1 ausgewählt) -->
      <div id="recordings-selection-actions" class="recordings-actions u-hidden">
        <span class="recordings-actions__section-label">Auswahl</span>
        <button id="btn-open-analyse"    class="btn-play-stop" disabled>📊 Analyse öffnen</button>
        <button id="btn-open-tagger"     class="btn-play-stop" disabled>🏷️ Onset Tagger öffnen</button>
        <button id="btn-download-selected" class="btn-play-stop">📥 Als ZIP herunterladen</button>
        <button id="btn-delete-selected" class="btn-play-stop recordings-actions__delete">🗑 Auswahl löschen</button>
      </div>

      <!-- Bulk-Aktionen (sichtbar wenn Aufnahmen vorhanden) -->
      <div id="recordings-bulk-actions" class="recordings-bulk-actions u-hidden">
        <span class="recordings-actions__section-label">Downloads</span>
        <div class="recordings-bulk-row">
          <button id="btn-dl-all"   class="btn-play-stop">📥 Alle als ZIP</button>
          <button id="btn-dl-sheet" class="btn-play-stop">📥 Noten-lesen als ZIP</button>
          <button id="btn-dl-chord" class="btn-play-stop">📥 Akkord als ZIP</button>
        </div>
        <span class="recordings-actions__section-label">Löschen</span>
        <div class="recordings-bulk-row">
          <button id="btn-del-all"   class="btn-play-stop recordings-actions__delete">🗑 Alle löschen</button>
          <button id="btn-del-sheet" class="btn-play-stop recordings-actions__delete">🗑 Alle Noten-lesen</button>
          <button id="btn-del-chord" class="btn-play-stop recordings-actions__delete">🗑 Alle Akkord</button>
        </div>
      </div>
    </div>
  </section>

  <script type="module" src="./bootstrap.js"></script>
</body>
</html>

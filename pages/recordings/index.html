<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aufnahmen - Gitarren-Lerntools</title>
  <link rel="stylesheet" href="../../style.css" />
  <style>
    .recordings-container {
      width: 100%;
      max-width: 680px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .recordings-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .recordings-item {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .recordings-item:hover {
      border-color: var(--color-accent);
    }

    .recordings-item--selected {
      border-color: var(--color-accent);
      background: color-mix(in srgb, var(--color-accent) 10%, var(--color-surface));
    }

    .recordings-item__badge {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-accent);
    }

    .recordings-item__name {
      font-size: 0.95rem;
      color: var(--color-text);
      word-break: break-all;
    }

    .recordings-item__meta {
      font-size: 0.78rem;
      color: var(--color-text-muted);
    }

    .recordings-empty {
      color: var(--color-text-muted);
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.9rem;
    }

    .recordings-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      padding: 0.5rem 0;
    }
  </style>
</head>
<body>
  <section id="view-recordings" class="view active">
    <gt-exercise-header title="Aufnahmen"></gt-exercise-header>

    <div class="recordings-container">
      <ul id="recordings-list" class="recordings-list"></ul>
      <p id="recordings-empty" class="recordings-empty u-hidden">Keine Aufnahmen vorhanden.</p>
      <div id="recordings-actions" class="recordings-actions u-hidden">
        <button id="btn-open-analyse" class="btn-play-stop">📊 Audio-Analyse öffnen</button>
        <button id="btn-open-tagger" class="btn-play-stop">🏷️ Onset Tagger öffnen</button>
      </div>
    </div>
  </section>

  <script type="module" src="./bootstrap.js"></script>
</body>
</html>

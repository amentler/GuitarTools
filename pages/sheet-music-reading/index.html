<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline';" />
  <title>Noten lesen - Gitarren-Lerntools</title>
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <section id="view-sheet-music" class="view active">
    <gt-exercise-header title="Noten lesen"></gt-exercise-header>

    <div class="exercise-subheader">
      <button id="btn-sheet-active-mode" class="btn-play-stop">Aktiv</button>
      <button id="btn-show-tab" class="btn-play-stop">Tabs</button>
      <button id="btn-endless-mode" class="btn-play-stop">Endlos</button>
      <button id="btn-record" class="btn-play-stop">Record</button>
    </div>

    <p id="sheet-music-permission" class="tuner-permission u-hidden"></p>

    <div id="sheet-music-status" class="sheet-music-status u-hidden">
      <span class="sheet-mic-label">Zielnote:</span>
      <span id="sheet-music-current-note" class="sheet-mic-current-note">–</span>
      <span id="sheet-music-feedback" class="feedback-text"></span>
    </div>

    <!-- PLAYBACK: Play/Stop · Record · BPM · Time Signature -->
    <div class="playback-controls">
      <button id="btn-sheet-play" class="btn-play-stop">▶ Play</button>
      <button id="btn-record-stop"   class="btn-play-stop u-hidden">Speichern</button>
      <button id="btn-record-cancel" class="btn-play-stop u-hidden">✕ Abbruch</button>

      <div class="playback-bpm">
        <label for="sheet-music-bpm-slider" class="settings-label">
          BPM: <span id="sheet-music-bpm-label">80</span>
        </label>
        <input type="range" id="sheet-music-bpm-slider" min="40" max="240" value="80" />
      </div>

      <div class="playback-timesig">
        <label for="sheet-music-time-sig" class="settings-label">Takt:</label>
        <select id="sheet-music-time-sig">
          <option value="2/4">2/4</option>
          <option value="3/4">3/4</option>
          <option value="4/4" selected>4/4</option>
          <option value="3/8">3/8</option>
          <option value="6/8">6/8</option>
        </select>
        <div id="beat-indicator" class="beat-indicator" aria-hidden="true"></div>
      </div>
    </div>

    <div id="score-container" class="score-container"></div>

    <button id="btn-new-bars" class="btn-play-stop">Neue Takte</button>

    <!-- SETTINGS: Fret Range + String Selection -->
    <div class="settings-panel">
      <div class="settings-row">
        <label for="sheet-music-key" class="settings-label">Tonart:</label>
        <select id="sheet-music-key" class="settings-item__select">
          <option value="C" selected>C-Dur</option>
          <option value="G">G-Dur</option>
          <option value="D">D-Dur</option>
          <option value="A">A-Dur</option>
          <option value="E">E-Dur</option>
          <option value="B">B-Dur</option>
          <option value="F#">F#-Dur</option>
          <option value="C#">C#-Dur</option>
          <option value="F">F-Dur</option>
          <option value="Bb">Bb-Dur</option>
          <option value="Eb">Eb-Dur</option>
          <option value="Ab">Ab-Dur</option>
        </select>
      </div>

      <div class="settings-row">
        <label for="sheet-music-fret-range-slider" class="settings-label">
          Bünde: <span id="sheet-music-fret-range-label">0 – 3</span>
        </label>
        <div class="range-dual">
          <input type="range" id="sheet-music-min-fret-slider" min="0" max="8" value="0" />
          <input type="range" id="sheet-music-fret-range-slider" min="0" max="8" value="3" />
        </div>
      </div>

      <div class="settings-row">
        <span class="settings-label">Saiten:</span>
        <div id="sheet-music-string-toggles" class="string-toggles">
          <button class="btn-string active" data-string="0">E2</button>
          <button class="btn-string active" data-string="1">A2</button>
          <button class="btn-string active" data-string="2">D3</button>
          <button class="btn-string active" data-string="3">G3</button>
          <button class="btn-string active" data-string="4">B3</button>
          <button class="btn-string active" data-string="5">E4</button>
        </div>
      </div>
    </div>
    <div class="sheet-music-actions">
      <button id="btn-download-recordings" class="btn-play-stop u-hidden">Download</button>
      <button id="btn-analyse-recording" class="btn-play-stop u-hidden">Analysieren</button>
      <button id="btn-open-recordings" class="btn-play-stop">Aufnahmen</button>
    </div>

    <!-- MIC SELECTION: only shown when multiple microphones are available -->
    <div id="mic-select-panel" class="settings-panel u-hidden">
      <div class="settings-row">
        <label for="sheet-music-mic-select" class="settings-label">Mikrofon:</label>
        <select id="sheet-music-mic-select"></select>
      </div>
    </div>

    <div class="strategy-status">
      <span class="strategy-status__label">Pitch:</span>
      <span id="sheet-music-strategy-pitch" class="strategy-status__value">—</span>
      <a>
      <span class="strategy-status__label">Onset:</span>
      <span id="sheet-music-strategy-onset" class="strategy-status__value">—</span>
      </a>
    </div>
  </section>

  <script type="module" src="./bootstrap.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" />
  <title>Audio-Analyse - Gitarren-Lerntools</title>
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <section id="view-audio-analyse" class="view active">
    <gt-exercise-header title="Audio-Analyse"></gt-exercise-header>

    <!-- Laden-Bereich -->
    <div class="analyse-load-section">
      <!-- Datei-Upload / Drag & Drop -->
      <div id="analyse-dropzone" class="analyse-dropzone">
        <input type="file" id="input-wav-file" accept=".wav,audio/wav,.zip,application/zip" />
        <label for="input-wav-file">WAV- oder ZIP-Datei wählen</label>
        &nbsp;oder hierher ziehen
      </div>
    </div>

    <!-- Status-Meldung -->
    <p id="analyse-status-msg" class="analyse-status u-hidden"></p>

    <!-- Strategie-Anzeige -->
    <div class="analyse-strategy-bar">
      <span>Pitch: <strong id="analyse-strategy-pitch">—</strong></span>
      <span>Onset: <strong id="analyse-strategy-onset">—</strong></span>
    </div>

    <!-- Statistik-Header -->
    <div id="analyse-stats-header" class="analyse-stats-header u-hidden"></div>

    <!-- Training Data Export -->
    <div id="analyse-training-export-row" class="analyse-training-export-row u-hidden">
      <button id="btn-export-training" class="btn-play-stop" type="button">📊 Training Data exportieren</button>
      <span id="analyse-export-status" class="analyse-export-status"></span>
    </div>

    <!-- Legende -->
    <div class="analyse-legend">
      <span class="legend-onset">— Erkannte Onsets</span>
      <span class="legend-tagged-onset">— Getaggte Onsets</span>
      <span>| Crosshair beim Hover</span>
      <span class="legend-invalid">▪ Grau = Signal zu leise</span>
    </div>

    <!-- Charts -->
    <div id="analyse-charts-wrapper" class="analyse-charts-wrapper u-hidden"></div>

  </section>

  <!-- Fixierte Bottom-Bar: Strategie-Auswahl + Slider + Transport-Buttons -->
  <div id="analyse-bottom-bar" class="analyse-bottom-bar">
    <div class="analyse-strategy-select-row">
      <label class="analyse-strategy-label">
        Pitch:
        <select id="analyse-pitch-select" class="analyse-strategy-select"></select>
      </label>
      <label class="analyse-strategy-label">
        Onset:
        <select id="analyse-onset-select" class="analyse-strategy-select"></select>
      </label>
    </div>
    <div id="analyse-slider-row" class="analyse-slider-row u-hidden">
      <span id="analyse-slider-time" class="analyse-slider-time">0.00 s</span>
      <input type="range" id="analyse-slider" class="analyse-slider" min="0" max="1000" value="0" step="1" />
      <span id="analyse-slider-dur" class="analyse-slider-dur">0.00 s</span>
    </div>
    <div id="analyse-range-controls" class="analyse-range-controls u-hidden">
      <div class="analyse-range-row">
        <span class="analyse-range-label">Start</span>
        <input id="analyse-range-start" class="analyse-range-slider" type="range" min="0" max="1" step="0.001" value="0" />
      </div>
      <div class="analyse-range-row">
        <span class="analyse-range-label">Ende</span>
        <input id="analyse-range-end" class="analyse-range-slider" type="range" min="0" max="1" step="0.001" value="1" />
      </div>
      <div class="analyse-option-row">
        <span id="analyse-range-display" class="analyse-range-display">0.00 s - 0.00 s</span>
        <label class="analyse-option-label">
          <input id="analyse-normalize-y" type="checkbox" checked />
          Vertikal normalisieren
        </label>
        <label class="analyse-option-label">
          <input id="analyse-show-detected-onsets" type="checkbox" checked />
          Erkannte Onsets
        </label>
        <label class="analyse-option-label">
          <input id="analyse-show-tagged-onsets" type="checkbox" checked />
          Getaggte Onsets
        </label>
      </div>
    </div>
    <div id="analyse-transport-row" class="analyse-transport-row u-hidden">
      <button id="btn-play-pause" class="btn-play-stop">▶ Abspielen</button>
      <button id="btn-stop-audio" class="btn-play-stop">⏹ Stop</button>
    </div>
  </div>

  <script type="module" src="./bootstrap.js"></script>
</body>
</html>

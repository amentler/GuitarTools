<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio-Analyse - Gitarren-Lerntools</title>
  <link rel="stylesheet" href="../../style.css" />
  <style>
    /* ── Analyse-spezifische Styles ─────────────────────────────────────── */

    .analyse-load-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      max-width: 640px;
      padding: 1rem;
    }

    .analyse-load-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .analyse-dropzone {
      border: 2px dashed var(--color-border);
      border-radius: var(--radius);
      padding: 1rem 2rem;
      text-align: center;
      color: var(--color-text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      width: 100%;
    }

    .analyse-dropzone.dragover,
    .analyse-dropzone:hover {
      border-color: var(--color-accent);
      background: var(--color-surface);
    }

    .analyse-dropzone label {
      cursor: pointer;
      color: var(--color-accent);
      font-weight: 600;
    }

    #input-wav-file {
      display: none;
    }

    /* Strategie-Anzeige */
    .analyse-strategy-bar {
      display: flex;
      gap: 1rem;
      font-size: 0.8rem;
      color: var(--color-text-muted);
      flex-wrap: wrap;
      justify-content: center;
    }

    .analyse-strategy-bar strong {
      color: var(--color-text);
    }

    /* Status-Meldung */
    .analyse-status {
      font-size: 0.9rem;
      color: var(--color-text-muted);
      text-align: center;
      padding: 0.5rem;
    }

    .analyse-status--error {
      color: var(--color-wrong);
    }

    /* Statistik-Header */
    .analyse-stats-header {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      justify-content: center;
      padding: 0.6rem 1rem;
      background: var(--color-surface);
      border-radius: var(--radius);
      font-size: 0.82rem;
      width: 100%;
      max-width: 800px;
    }

    .stat-item {
      color: var(--color-text);
    }

    /* Charts-Wrapper */
    .analyse-charts-wrapper {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0 0.5rem 7rem; /* extra bottom padding for fixed 2-row bar */
    }

    .analysis-chart-block {
      width: 100%;
      position: relative;
      padding-bottom: 18px; /* space for inline cursor label */
    }

    .analysis-chart-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.3rem 0 0.15rem;
    }

    .analysis-chart-svg-wrap {
      width: 100%;
      aspect-ratio: var(--chart-aspect, 1000 / 100);
    }

    .analysis-chart-svg-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Inline Cursor-Label unterhalb des Chart-Cursors */
    .analysis-cursor-value {
      position: absolute;
      bottom: 2px;
      left: 0;
      transform: translateX(-50%);
      opacity: 0;
      pointer-events: none;
      background: rgba(30, 20, 10, 0.82);
      color: #a89cfc;
      border-radius: 3px;
      padding: 1px 6px;
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
      z-index: 5;
      transition: opacity 0.08s;
    }

    /* Fixierte Transport-Bar am unteren Bildschirmrand */
    .analyse-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding: 0.4rem 0.5rem 0.5rem;
      background: var(--color-surface, #1e1209);
      border-top: 1px solid var(--color-border, #4a3a2a);
      box-shadow: 0 -3px 10px rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
    }

    .analyse-slider-row {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-sizing: border-box;
    }

    .analyse-transport-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 0.3rem;
    }

    .analyse-slider {
      flex: 1;
      min-width: 0;
      width: 0; /* flex shrink to fit */
      accent-color: var(--color-accent, #7c4dff);
      cursor: pointer;
    }

    .analyse-slider-time,
    .analyse-slider-dur {
      font-size: 0.72rem;
      color: var(--color-text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      min-width: 3.5em;
    }

    .analyse-slider-time { text-align: right; }
    .analyse-slider-dur  { text-align: left; }

    /* Legend */
    .analyse-legend {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: 0.76rem;
      color: var(--color-text-muted);
      padding: 0.4rem 0;
      justify-content: center;
    }

    .legend-onset {
      color: #e74c3c;
      font-weight: 600;
    }

    .legend-invalid {
      color: #aaa;
    }
  </style>
</head>
<body>
  <section id="view-audio-analyse" class="view active">
    <gt-exercise-header title="Audio-Analyse"></gt-exercise-header>

    <!-- Laden-Bereich -->
    <div class="analyse-load-section">
      <!-- Datei-Upload / Drag & Drop -->
      <div id="analyse-dropzone" class="analyse-dropzone">
        <input type="file" id="input-wav-file" accept=".wav,audio/wav" />
        <label for="input-wav-file">WAV-Datei wählen</label>
        &nbsp;oder hierher ziehen
      </div>
    </div>

    <!-- Status-Meldung -->
    <p id="analyse-status-msg" class="analyse-status u-hidden"></p>

    <!-- Strategie-Anzeige -->
    <div class="analyse-strategy-bar">
      <span>Pitch: <strong id="analyse-strategy-pitch">—</strong></span>
      <span>Onset: <strong id="analyse-strategy-onset">—</strong></span>
    </div>

    <!-- Statistik-Header -->
    <div id="analyse-stats-header" class="analyse-stats-header u-hidden"></div>

    <!-- Legende -->
    <div class="analyse-legend">
      <span class="legend-onset">— Onset-Marker</span>
      <span>| Crosshair beim Hover</span>
      <span class="legend-invalid">▪ Grau = Signal zu leise</span>
    </div>

    <!-- Charts -->
    <div id="analyse-charts-wrapper" class="analyse-charts-wrapper u-hidden"></div>

  </section>

  <!-- Fixierte Bottom-Bar: Slider + Transport-Buttons -->
  <div id="analyse-bottom-bar" class="analyse-bottom-bar u-hidden">
    <div class="analyse-slider-row">
      <span id="analyse-slider-time" class="analyse-slider-time">0.00 s</span>
      <input type="range" id="analyse-slider" class="analyse-slider" min="0" max="1000" value="0" step="1" />
      <span id="analyse-slider-dur" class="analyse-slider-dur">0.00 s</span>
    </div>
    <div class="analyse-transport-row">
      <button id="btn-play-pause" class="btn-play-stop">▶ Abspielen</button>
      <button id="btn-stop-audio" class="btn-play-stop">⏹ Stop</button>
    </div>
  </div>

  <script type="module" src="./bootstrap.js"></script>
</body>
</html>

labels:
  onset_tolerance_ms: 30
  positive_window_ms: 20

xgboost:
  device: cuda
  tree_method: hist
  fallback_to_cpu: true
  max_depth: 6
  min_child_weight: 5
  learning_rate: 0.03
  n_estimators: 300
  subsample: 0.8
  colsample_bytree: 0.8
  gamma: 0.3
  reg_alpha: 0.05
  reg_lambda: 1.5
  scale_pos_weight: auto

sampling:
  negative_sampling_ratio: 10.0
  strategy: random

decision:
  probability_threshold: 0.85
  lookahead_frames: 4
  threshold_selection:
    enabled: true
    target_recall: 0.9
    min_precision: 0.35
    beta: 2.0
    steps: 999

training:
  split_mode: by_file
  test_split: 0.2
  validation_split: 0.1
  early_stopping_rounds: 20
  random_state: 42
  normalize_features: true
  hyperparameter_tuning:
    enabled: true
    n_iter: 8
    max_depth: [6]

paths:
  training_data_dir: "./training_data"
  output_model: "./models/onset_detector.onnx"
  output_schema: "./models/onset_detector.schema.json"
  output_metrics: "./models/onset_detector.metrics.json"

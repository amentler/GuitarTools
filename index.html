<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Gitarren-Lerntools</title>
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GuitarTools" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- HAUPTMENÜ                                                               -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <section id="view-menu" class="view">
    <header class="menu-header">
      <h1 class="menu-title">🎸 Gitarren-Lerntools</h1>
    </header>

    <div class="menu-section">
      <h3 class="menu-section-title">Übungen</h3>
      <div class="menu-cards">
        <gt-menu-card icon="🎯" title="Griffbrett" href="pages/fretboard-tone-recognition/index.html"></gt-menu-card>

        <gt-menu-card icon="triad-c-major" title="Akkord-Trainer" href="pages/akkord-trainer/index.html"></gt-menu-card>

        <gt-menu-card icon="🔍" title="Ton-Finder" href="pages/ton-finder/index.html"></gt-menu-card>
      </div>
    </div>

    <div class="menu-section">
      <h3 class="menu-section-title">Übungen mit Gitarre</h3>
      <div class="menu-cards">
        <gt-menu-card icon="🎼" title="Noten lesen" href="pages/sheet-music-reading/index.html"></gt-menu-card>

        <gt-menu-card icon="🎤" title="Ton spielen" href="pages/note-playing/index.html"></gt-menu-card>

        <gt-menu-card icon="triad-double" title="Akkord spielen" href="pages/chord-playing-essentia/index.html"></gt-menu-card>

        <gt-menu-card icon="triad-triple" title="Akkorde spielen" href="pages/akkordfolgen-trainer/index.html"></gt-menu-card>
      </div>
    </div>

    <div class="menu-section">
      <h3 class="menu-section-title">Werkzeuge</h3>
      <div class="menu-cards">
        <gt-menu-card icon="tuner-needle" title="Tuner" href="pages/guitar-tuner/index.html"></gt-menu-card>

        <gt-menu-card icon="⏱️" title="Metronom" href="pages/metronome/index.html"></gt-menu-card>

        <gt-menu-card icon="📋" title="Akkord Übersicht" href="pages/akkord-uebersicht/index.html"></gt-menu-card>

        <gt-menu-card icon="🎙️" title="Akkord-Recorder" href="pages/chord-recorder/index.html"></gt-menu-card>
      </div>
    </div>

    <details class="global-settings" id="global-settings">
      <summary class="global-settings__summary">⚙ Einstellungen</summary>
      <div class="global-settings__body">
        <label class="settings-item">
          <span class="settings-item__label">
            <input type="checkbox" id="setting-debug-mode" class="settings-item__checkbox">
            Debug-Modus
          </span>
        </label>
        <div class="settings-item">
          <button type="button" id="setting-debug-copy" class="btn-update">Debug-Daten kopieren</button>
          <span id="setting-debug-copy-status" class="settings-item__desc" aria-live="polite"></span>
        </div>
        <label class="settings-item">
          <span class="settings-item__label">
            <input type="checkbox" id="setting-srs-enabled" class="settings-item__checkbox" checked>
            Adaptives Lernen
          </span>
          <span class="settings-item__desc">Schwierige Aufgaben werden häufiger abgefragt</span>
        </label>
        <label class="settings-item">
          <span class="settings-item__label">
            <input type="checkbox" id="setting-chord-detection-use-essentia" class="settings-item__checkbox" checked>
            Akkord-Erkennung mit Essentia / WASM
          </span>
          <span class="settings-item__desc">Gilt für Akkord spielen und Akkorde spielen; aus = Pure JS</span>
        </label>
      </div>
    </details>

    <footer class="menu-footer">
      <button id="btn-update" class="btn-update">⟳ Neu laden</button>
      <p id="app-version" class="app-version"></p>
    </footer>
  </section>












  <script type="module" src="js/app.js"></script>
</body>
</html>
